<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BANG!</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ─────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Warm sand & wanted-poster palette: light tan/gold stage, deep red
     accent, chip-red / mult-blue accents, cream card faces. */
  --bg-deep:      #C49351;
  --bg-mid:       #CDA366;
  --surface-low:  #D6B27B;
  --surface:      #DEC290;
  --surface-high: #E7D1A5;
  --surface-top:  #F0E1BA;
  --on-surface:   #2a1810;
  --on-muted:     #6b4a30;
  --outline:      #241206;
  --outline-soft: #7a5228;
  --accent:         #9b211e;
  --accent-dim:     #6e1512;
  --accent-text:    #fbefd9;
  --red:          #ff5d73;
  --red-dim:      #6e2030;
  --green:        #48e08a;
  --green-dim:    #1f5a3c;
  --blue:         #4fd0ff;
  --blue-dim:     #1c4a6e;
  --purple-acc:   #5c3a86;
  --paper:        #fff4de;
  --paper-edge:   #e0b95a;
  --ink:          #2a1a3a;
  --shadow:       rgba(40, 20, 8, 0.45);
  --font-head:    'Bungee', 'Baloo 2', 'Arial Black', sans-serif;
  --font-body:    'Nunito', 'Segoe UI', sans-serif;
  --font-mono:    'Baloo 2', 'Segoe UI', sans-serif;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  background: var(--bg-deep);
  color: var(--on-surface);
}

/* ── STAGE BACKGROUNDS ────────────────────────────────── */
.dither-bg {
  background:
    radial-gradient(ellipse at 50% -10%, rgba(155,33,30,0.16) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 110%, rgba(92,58,134,0.14) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-mid) 0%, var(--bg-deep) 100%);
  background-color: var(--bg-deep);
}
.dither-floor {
  background:
    radial-gradient(ellipse at 50% 0%, rgba(155,33,30,0.10) 0%, transparent 50%),
    repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 2px, transparent 2px, transparent 26px),
    linear-gradient(180deg, var(--surface-low) 0%, var(--bg-deep) 100%);
  background-color: var(--bg-deep);
}

/* ── SUITS ────────────────────────────────────────────── */
.suit-red   { color: #d81c3f; font-weight: 800; }
.suit-black { color: var(--ink); font-weight: 800; }

/* ── CHUNKY BUTTONS ──────────────────────────────────── */
.pixel-btn {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 400;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: 3px solid var(--outline);
  border-radius: 14px;
  background: var(--surface-high);
  color: var(--on-surface);
  padding: 12px 22px;
  cursor: pointer;
  box-shadow: 0 5px 0 var(--outline), 0 8px 14px var(--shadow);
  transition: background 0.12s, color 0.12s, transform 0.08s, box-shadow 0.08s;
  user-select: none;
}
.pixel-btn:hover  { background: var(--surface-top); transform: translateY(-2px); box-shadow: 0 7px 0 var(--outline), 0 12px 18px var(--shadow); }
.pixel-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--outline), 0 4px 8px var(--shadow); }
.pixel-btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--outline); box-shadow: 0 5px 0 var(--accent-dim), 0 8px 16px rgba(155,33,30,0.35); }
.pixel-btn.primary:hover { background: #b9332e; box-shadow: 0 7px 0 var(--accent-dim), 0 12px 20px rgba(155,33,30,0.45); }
.pixel-btn.primary:active { box-shadow: 0 2px 0 var(--accent-dim); }
.pixel-btn.ghost   { background: transparent; border-color: var(--outline-soft); color: var(--on-muted); box-shadow: none; }
.pixel-btn.ghost:hover { background: var(--surface-high); color: var(--on-surface); transform: none; }

/* ── HEARTS ───────────────────────────────────────────── */
.hearts { display: flex; gap: 3px; align-items: center; }
.heart  { font-size: 14px; line-height: 1; }
.heart.full  { color: var(--red); text-shadow: 0 0 6px rgba(255,93,115,0.85); }
.heart.empty { color: #4a3a68; }

/* ── TOP NAVBAR ──────────────────────────────────────── */
#topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: 52px;
  background: linear-gradient(180deg, var(--surface-high), var(--surface-low));
  border-bottom: 3px solid var(--outline);
  flex-shrink: 0;
  z-index: 10;
}
#topbar .title {
  font-family: var(--font-head);
  font-size: 18px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: 2px;
  text-shadow: 2px 2px 0 var(--outline);
}
#topbar .icon-btn {
  background: none; border: none; cursor: pointer;
  color: var(--on-muted); font-size: 20px; padding: 4px 8px;
  transition: color 0.1s, transform 0.1s;
}
#topbar .icon-btn:hover { color: var(--accent); transform: scale(1.15); }
#topbar .phase-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  color: var(--accent-text);
  background: var(--accent);
  border: 2px solid var(--outline);
  border-radius: 999px;
  padding: 3px 12px;
  max-width: 160px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── BOTTOM NAVBAR ───────────────────────────────────── */
#navbar {
  display: flex;
  height: 58px;
  background: linear-gradient(0deg, var(--surface-high), var(--surface-low));
  border-top: 3px solid var(--outline);
  flex-shrink: 0;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  border-right: 2px solid var(--outline);
  color: var(--on-muted);
  cursor: pointer;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color 0.1s, background 0.1s;
}
.nav-btn:last-child { border-right: none; }
.nav-btn:hover { background: var(--surface); color: var(--on-surface); }
.nav-btn.active { color: var(--accent); }
.nav-btn svg { width: 20px; height: 20px; }

/* ── SCREENS ─────────────────────────────────────────── */
.screen { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.screen.active { display: flex; }

/* ── SETUP SCREEN ────────────────────────────────────── */
#screen-setup { overflow-y: auto; align-items: center; }
#screen-setup .inner {
  width: 100%;
  max-width: 420px;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.setup-hero {
  text-align: center;
  padding: 44px 0 28px;
}
.setup-hero .bang-title {
  font-family: var(--font-head);
  font-size: 76px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: -2px;
  text-shadow:
    3px 3px 0 var(--outline), -3px -3px 0 var(--outline),
    3px -3px 0 var(--outline), -3px 3px 0 var(--outline),
    0 10px 24px rgba(155,33,30,0.35);
  line-height: 1;
  animation: title-bounce 2.6s ease-in-out infinite;
  display: inline-block;
}
@keyframes title-bounce {
  0%, 100% { transform: translateY(0) rotate(-1deg); }
  50%      { transform: translateY(-6px) rotate(1deg); }
}
.setup-hero .subtitle {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 4px;
  color: var(--purple-acc);
  margin-top: 10px;
  text-transform: uppercase;
}
.setup-card {
  width: 100%;
  margin-bottom: 16px;
  padding: 22px;
  border: 3px solid var(--outline);
  border-radius: 18px;
  background: linear-gradient(180deg, var(--surface-high), var(--surface));
  box-shadow: 0 6px 0 var(--outline), 0 10px 18px var(--shadow);
}
.setup-label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--accent);
  text-transform: uppercase;
  margin-bottom: 14px;
  text-align: center;
}
.counter-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
}
.counter-btn {
  width: 48px; height: 48px;
  border-radius: 50%;
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 400;
  background: var(--surface-top);
  border: 3px solid var(--outline);
  color: var(--on-surface);
  cursor: pointer;
  box-shadow: 0 4px 0 var(--outline);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.1s, transform 0.08s;
}
.counter-btn:hover { background: var(--accent); color: var(--accent-text); transform: translateY(-2px); }
.counter-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--outline); }
.counter-val {
  font-family: var(--font-head);
  font-size: 48px;
  font-weight: 400;
  color: var(--accent);
  min-width: 56px;
  text-align: center;
  text-shadow: 2px 2px 0 var(--outline);
}
.pistolero-list { display: flex; flex-direction: column; gap: 12px; }
.pistolero-row { display: flex; flex-direction: column; gap: 5px; }
.pistolero-row label {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--on-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.pistolero-row input {
  width: 100%;
  background: var(--surface-low);
  border: 3px solid var(--outline-soft);
  border-radius: 12px;
  color: var(--on-surface);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 16px;
  padding: 10px 14px;
  outline: none;
  transition: border-color 0.1s, box-shadow 0.1s;
}
.pistolero-row input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(155,33,30,0.25); }
.pistolero-row input::placeholder { color: var(--outline-soft); font-weight: 400; }
#btn-iniciar {
  width: 100%;
  padding: 18px;
  font-size: 17px;
  letter-spacing: 2px;
  margin-bottom: 32px;
}

/* ── CHARACTER SELECTION ─────────────────────────────── */
#screen-personaje {
  background: var(--bg-deep);
  overflow-y: auto;
}
#screen-personaje .hero {
  text-align: center;
  padding: 26px 16px 16px;
  border-bottom: 3px solid var(--outline);
  flex-shrink: 0;
}
#screen-personaje h2 {
  font-family: var(--font-head);
  font-size: 22px;
  font-weight: 400;
  color: var(--accent);
  text-shadow: 2px 2px 0 var(--outline);
}
#screen-personaje .who {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--purple-acc);
  letter-spacing: 2px;
  margin-top: 8px;
  text-transform: uppercase;
}
#personaje-cards-container {
  display: flex;
  gap: 22px;
  padding: 26px 20px;
  justify-content: center;
  align-items: flex-start;
  flex: 1;
  flex-wrap: wrap;
}
.personaje-card-new {
  flex: 0 1 220px;
  min-width: 150px;
  max-width: 280px;
  border: 3px solid var(--outline);
  border-radius: 20px;
  background: var(--surface);
  box-shadow: 0 6px 0 var(--outline), 0 10px 18px var(--shadow);
  cursor: pointer;
  transition: border-color 0.12s, transform 0.12s, box-shadow 0.12s;
  display: flex;
  flex-direction: column;
  user-select: none;
  overflow: hidden;
}
.personaje-card-new:hover {
  border-color: var(--accent);
  transform: translateY(-6px) rotate(-1deg);
  box-shadow: 0 0 0 3px var(--accent), 0 10px 0 var(--outline), 0 16px 22px rgba(155,33,30,0.3);
}
.personaje-card-new.selected {
  border-color: var(--accent);
  transform: translateY(-8px) scale(1.03);
  box-shadow: 0 0 0 4px var(--accent), 0 10px 0 var(--outline), 0 0 30px rgba(155,33,30,0.6);
}
.personaje-portrait {
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(160deg, var(--surface-top), var(--surface-low));
  border-bottom: 3px solid var(--outline);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-head);
  font-size: 48px;
  font-weight: 400;
  color: var(--purple-acc);
  overflow: hidden;
}
.personaje-portrait img { width: 100%; height: 100%; object-fit: cover; }
.personaje-info { padding: 14px; }
.personaje-info .p-name {
  font-family: var(--font-head);
  font-size: 13px;
  font-weight: 400;
  color: var(--accent);
  margin-bottom: 8px;
}
.personaje-info .p-vidas { margin-bottom: 8px; }
.personaje-info .p-desc {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 12px;
  color: var(--on-muted);
  line-height: 1.5;
  border-top: 2px solid var(--outline-soft);
  padding-top: 10px;
}
.personaje-hint {
  text-align: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: var(--outline-soft);
  padding: 14px;
  text-transform: uppercase;
}

/* ── GAME SCREEN ─────────────────────────────────────── */
#screen-game { background: var(--bg-deep); }

/* Rival panels */
#rivals-zone {
  display: flex;
  gap: 10px;
  padding: 12px 10px 8px;
  overflow-x: auto;
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--surface-low), var(--bg-deep));
  border-bottom: 3px solid var(--outline);
  scrollbar-width: none;
}
#rivals-zone::-webkit-scrollbar { display: none; }
.rival-panel {
  flex-shrink: 0;
  width: 112px;
  border: 3px solid var(--outline-soft);
  border-radius: 16px;
  background: var(--surface);
  box-shadow: 0 5px 0 var(--outline), 0 8px 14px var(--shadow);
  cursor: default;
  position: relative;
  transition: border-color 0.1s, transform 0.1s, box-shadow 0.1s;
  overflow: hidden;
}
.rival-panel.muerto { opacity: 0.45; filter: grayscale(0.8); }
.rival-panel.turno  { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(155,33,30,0.5), 0 5px 0 var(--outline), 0 8px 16px rgba(155,33,30,0.3); }
.rival-panel.seleccionable {
  border-color: var(--green);
  cursor: pointer;
  animation: pulse-border 0.9s infinite;
}
.rival-panel.fuera-alcance { border-color: var(--red); opacity: 0.6; }
.rival-panel.seleccionable:hover { transform: translateY(-4px) scale(1.03); }

@keyframes pulse-border {
  0%, 100% { box-shadow: 0 0 0 2px rgba(72,224,138,0.55), 0 5px 0 var(--outline); }
  50%       { box-shadow: 0 0 0 5px rgba(72,224,138,0.85), 0 5px 0 var(--outline); }
}

.rp-portrait {
  width: 100%;
  aspect-ratio: 1 / 0.85;
  background: linear-gradient(160deg, var(--surface-top), var(--surface-low));
  border-bottom: 2px solid var(--outline-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-head);
  font-size: 24px;
  color: var(--purple-acc);
  overflow: hidden;
  position: relative;
}
.rp-sheriff-badge {
  position: absolute; top: 5px; left: 5px;
  font-size: 16px; line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
}
@keyframes damage-shake {
  0%,100% { transform: translateX(0) rotate(0deg); }
  20%     { transform: translateX(-5px) rotate(-1.5deg); }
  40%     { transform: translateX(5px)  rotate(1.5deg); }
  60%     { transform: translateX(-3px) rotate(-0.5deg); }
  80%     { transform: translateX(3px)  rotate(0.5deg); }
}
.rival-panel.damaged { animation: damage-shake 0.38s ease; }
.rp-body { padding: 7px 7px 5px; }
.rp-name { font-family: var(--font-head); font-size: 10px; font-weight: 400; color: var(--on-surface); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
.rp-personaje { font-family: var(--font-mono); font-size: 9px; font-weight: 700; color: var(--purple-acc); margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-stats { font-family: var(--font-mono); font-size: 9px; font-weight: 700; color: var(--on-muted); margin-top: 4px; }
.rp-badges { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.rp-badge {
  font-size: 13px; line-height: 1;
  border-radius: 6px; padding: 2px 4px;
  background: rgba(0,0,0,0.08);
  border: 1px solid rgba(0,0,0,0.12);
  filter: drop-shadow(0 1px 1px rgba(0,0,0,0.2));
  display: inline-flex; align-items: center; justify-content: center;
}
.rp-badge-carcel          { background: #3a3550; }
.rp-badge-mustang         { background: var(--green-dim); }
.rp-badge-barril          { background: var(--blue-dim); }
.rp-badge-dinamita        { background: var(--red-dim); }
.rp-badge-miraTelescopica { background: #e4d9f0; }
.rp-badge-volcanic        { background: #f3ded2; }

/* Center play zone */
#play-zone {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 34px;
  padding: 8px;
  position: relative;
  overflow: hidden;
}
.pile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pile-label { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 2px; color: var(--on-muted); text-transform: uppercase; }
.pile-card {
  width: 74px; height: 106px;
  border: 3px solid var(--outline);
  border-radius: 12px;
  background: var(--surface-high);
  box-shadow: 0 5px 0 var(--outline), 0 8px 14px var(--shadow);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.pile-card.back {
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 6px, transparent 6px 12px),
    linear-gradient(160deg, var(--surface-top), var(--surface-low) 70%);
  position: relative;
}
.pile-card.back::before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1.5px solid rgba(155,33,30,0.35);
  border-radius: 8px;
  pointer-events: none;
}
.pile-card.back::after {
  content: 'BANG!';
  font-family: var(--font-head);
  font-size: 17px;
  color: var(--accent);
  opacity: 0.92;
  letter-spacing: 1px;
  text-shadow: 1px 1px 0 rgba(0,0,0,0.25), 0 0 10px rgba(155,33,30,0.5);
  transform: rotate(-8deg);
  display: block;
}
.pile-card.face { background: var(--paper); color: var(--ink); border-color: var(--paper-edge); display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 4px 3px; }
.pile-card.face.card-in { animation: card-in 0.22s cubic-bezier(0.2,0.8,0.3,1); }
@keyframes card-in {
  from { transform: scale(0.55) translateY(-18px); opacity: 0; }
  to   { transform: scale(1)    translateY(0);     opacity: 1; }
}
.pile-card .pc-nombre { font-family: var(--font-head); font-size: 8px; font-weight: 400; text-align: center; line-height: 1.2; word-break: break-word; }
.pile-card .pc-art { display: flex; align-items: center; justify-content: center; flex: 1; }
.pile-card .pc-art canvas { max-width: 56px; max-height: 56px; image-rendering: pixelated; }
.pile-card .pc-palo { font-family: var(--font-mono); font-size: 11px; font-weight: 700; text-align: center; }

/* Mesa cards (almacen, lucky duke, etc.) */
#mesa-cards { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.mesa-card {
  width: 74px; height: 102px;
  background: var(--paper);
  border: 3px solid var(--paper-edge);
  border-radius: 12px;
  box-shadow: 0 5px 0 var(--outline), 0 8px 14px var(--shadow);
  cursor: pointer;
  display: flex; flex-direction: column; justify-content: space-between; padding: 7px;
  transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
}
.mesa-card:hover { border-color: var(--accent); transform: translateY(-5px) rotate(-2deg) scale(1.04); box-shadow: 0 0 0 3px var(--accent), 0 10px 0 var(--outline), 0 12px 18px rgba(155,33,30,0.35); }
.mesa-card .mc-nombre { font-family: var(--font-head); font-size: 9px; font-weight: 400; color: var(--ink); line-height: 1.2; }
.mesa-card .mc-palo { font-family: var(--font-mono); font-size: 11px; font-weight: 700; }
.mesa-card .mc-art { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.mesa-card .mc-art canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 58px; max-height: 58px; }

/* ── HAND ZONE ───────────────────────────────────────── */
#hand-zone {
  flex-shrink: 0;
  height: 132px;
  background: linear-gradient(0deg, var(--surface-low), var(--bg-deep));
  border-top: 3px solid var(--outline);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 8px;
  overflow: visible;
}
#hand-cards {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  position: relative;
  height: 115px;
  width: 100%;
}

/*
 * Hand cards: wrapper+inner pattern.
 * .hc-wrap  → rotation + position + FIXED HEIGHT (card + lift room)
 * .hand-card → visual card, aligned to bottom of wrapper
 *
 * Key: wrapper height (130px) > card height (100px) + lift (24px).
 * When the card lifts, the mouse stays inside the wrapper bounds → no flicker.
 * Hover is on the wrapper, not the card, so hit-test never breaks.
 */
.hc-wrap {
  position: absolute;
  bottom: 0;
  width: 74px;
  height: 130px;            /* tall enough to contain lifted card */
  transform-origin: bottom center;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.hand-card {
  width: 74px;
  height: 100px;
  background: var(--paper);
  border: 3px solid var(--paper-edge);
  border-radius: 12px;
  box-shadow: 0 5px 0 var(--outline), 0 8px 14px var(--shadow);
  cursor: default;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 6px;
  transition: transform 0.15s, border-color 0.1s, box-shadow 0.15s;
  flex-shrink: 0;
}
.hand-card.jugable { cursor: pointer; }
/* Hover: wrapper sube en z-index (CSS, no JS) y carta sube y gira ligeramente.
   El wrapper tiene 130px de alto, la carta 100px → cuando sube 24px
   sigue dentro del wrapper → el ratón no sale → sin parpadeo. */
.hc-wrap:hover {
  z-index: 100;
}
.hc-wrap:hover .hand-card.jugable {
  transform: translateY(-24px) scale(1.07) rotate(-2deg);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent), 0 8px 0 var(--outline), 0 14px 20px rgba(155,33,30,0.4);
}
@keyframes card-play {
  0%   { transform: translateY(-24px) scale(1.07); opacity: 1; }
  60%  { transform: translateY(-90px) scale(1.15); opacity: 0.7; }
  100% { transform: translateY(-140px) scale(0.5); opacity: 0; }
}
.hand-card.playing {
  animation: card-play 0.35s ease-in forwards;
  pointer-events: none;
}
.hand-card.clicked {
  opacity: 0.35;
  pointer-events: none;
  transition: opacity 0.1s;
}
.hand-card .hc-nombre { font-family: var(--font-head); font-size: 8px; font-weight: 400; color: var(--ink); line-height: 1.2; overflow: hidden; word-break: break-word; max-width: 100%; }
.hand-card .hc-tipo  { font-family: var(--font-mono); font-size: 8px; font-weight: 700; color: #8a6a30; }
.hand-card.tipo-arma   { border-color: var(--blue); background: #e3f6ff; }
.hand-card.tipo-objeto { border-color: var(--green); background: #e4fbef; }
.hand-card.tipo-arma { background: var(--paper); border-color: var(--paper-edge); }
.hc-art { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.hc-art canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 62px; max-height: 62px; }
.hc-bottom { display: flex; align-items: center; justify-content: center; position: relative; height: 20px; }
.hc-skull { position: absolute; left: 0; top: 50%; transform: translateY(-50%); line-height: 0; }
.hc-skull canvas { image-rendering: pixelated; image-rendering: crisp-edges; width: 18px; height: 21px; }
.hc-range { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--outline); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-size: 11px; font-weight: 700; color: var(--accent); }

/* Rival card (hidden / equip) */
.rival-card-hidden {
  width: 46px; height: 64px;
  background: var(--surface-high); border: 3px solid var(--outline-soft);
  border-radius: 10px;
  box-shadow: 0 4px 0 var(--outline); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--accent); opacity: 0.8; flex-shrink: 0;
  transition: transform 0.1s, opacity 0.1s;
}
.rival-card-hidden:hover { border-color: var(--accent); opacity: 1; transform: translateY(-3px); }
.rival-card-equip {
  width: 66px; height: 90px; background: var(--paper);
  border: 3px solid var(--paper-edge); border-radius: 10px;
  box-shadow: 0 4px 0 var(--outline);
  cursor: pointer; padding: 6px; flex-shrink: 0;
  transition: transform 0.1s, border-color 0.1s;
}
.rival-card-equip:hover { border-color: var(--accent); transform: translateY(-3px); }
.rival-card-equip .rce-nombre { font-family: var(--font-head); font-size: 8px; font-weight: 400; color: var(--ink); }
.rival-card-equip .rce-badge  { font-family: var(--font-mono); font-size: 8px; font-weight: 700; color: var(--paper-edge); margin-top: 4px; }

/* ── PROMPT BAR ──────────────────────────────────────── */
#prompt-bar {
  flex-shrink: 0;
  background: linear-gradient(0deg, var(--surface-low), var(--surface));
  border-top: 3px solid var(--outline);
  border-radius: 18px 18px 0 0;
  padding: 12px 14px;
  min-height: 76px;
}
#prompt-texto {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 13px;
  color: var(--on-surface);
  margin-bottom: 10px;
  line-height: 1.4;
  min-height: 18px;
}
#prompt-botones { display: flex; gap: 8px; flex-wrap: wrap; }
.prompt-btn {
  font-family: var(--font-head);
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: 3px solid var(--outline);
  border-radius: 12px;
  background: var(--surface-top);
  color: var(--on-surface);
  padding: 9px 18px;
  cursor: pointer;
  box-shadow: 0 4px 0 var(--outline);
  transition: background 0.1s, transform 0.08s, box-shadow 0.08s;
}
.prompt-btn:hover  { background: var(--accent); color: var(--accent-text); transform: translateY(-2px); box-shadow: 0 6px 0 var(--accent-dim); }
.prompt-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--outline); }
.prompt-btn.fin    { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.prompt-btn.fin:hover    { background: var(--green); color: var(--ink); box-shadow: 0 6px 0 var(--green-dim); }
.prompt-btn.poder  { background: var(--blue-dim); border-color: var(--blue); color: var(--blue); }
.prompt-btn.poder:hover  { background: var(--blue); color: var(--ink); box-shadow: 0 6px 0 var(--blue-dim); }
.prompt-btn.cancel { background: var(--red-dim); border-color: var(--red); color: var(--red); }
.prompt-btn.cancel:hover { background: var(--red); color: var(--ink); box-shadow: 0 6px 0 var(--red-dim); }
/* Disabled/sending state */
.prompt-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
#prompt-bar.sending #prompt-texto::after {
  content: ' ▌';
  color: var(--accent);
  animation: blink 0.5s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* ── LOG DRAWER ──────────────────────────────────────── */
#log-drawer {
  position: fixed;
  bottom: 58px; left: 0; right: 0;
  height: 45vh;
  background: var(--surface-low);
  border-top: 3px solid var(--outline);
  border-radius: 18px 18px 0 0;
  z-index: 50;
  display: none;
  flex-direction: column;
}
#log-drawer.open { display: flex; }
#log-drawer-header {
  padding: 10px 14px;
  border-bottom: 2px solid var(--outline-soft);

}
#log-drawer-header span { font-family: var(--font-mono); font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; }
#log-msgs { flex: 1; overflow-y: auto; padding: 10px 14px; font-family: var(--font-mono); font-weight: 600; font-size: 11px; color: var(--on-muted); line-height: 1.6; }
.log-msg { padding: 3px 0; border-bottom: 1px solid var(--surface-high); }
.log-msg.important { color: var(--accent); font-weight: 700; }

/* ── MENU MODAL ──────────────────────────────────────── */
#menu-modal { display: none; position: fixed; inset: 0; background: rgba(10,6,20,0.85); z-index: 100; align-items: center; justify-content: center; }
#menu-modal.open { display: flex; }
#menu-content { width: 280px; border: 3px solid var(--outline); border-radius: 18px; background: var(--surface); box-shadow: 0 8px 0 var(--outline), 0 16px 26px var(--shadow); overflow: hidden; }
#menu-content .menu-title { font-family: var(--font-head); font-size: 14px; font-weight: 400; letter-spacing: 1px; color: var(--accent); padding: 16px 18px; border-bottom: 2px solid var(--outline-soft); text-transform: uppercase; }
.menu-item { display: block; width: 100%; padding: 15px 18px; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; background: none; border: none; border-bottom: 1px solid var(--surface-high); color: var(--on-surface); cursor: pointer; text-align: left; transition: background 0.1s, color 0.1s; }
.menu-item:hover { background: var(--surface-high); color: var(--accent); }
.menu-item.danger { color: var(--red); }
.menu-item.danger:hover { background: var(--red-dim); color: #fff; }

/* ── GAME OVER ───────────────────────────────────────── */
#screen-gameover {

  overflow-y: auto;
}

#go-tabla { width: 100%; max-width: 480px; border-collapse: separate; border-spacing: 0; border: 3px solid var(--outline); border-radius: 14px; overflow: hidden; }

/* ── LAYOUT WRAPPER ──────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; }

<script>
// ── Estado global ─────────────────────────────────────
let numJugadores = 4;
let pollInterval = null;
let logCount = 0;
let isSending = false;
let _questionAnswered = false;
let gameOver = false;
let lastPreguntaKey = null;   // evita re-render si la pregunta no cambió
window._resetPollState = () => { lastPreguntaKey = null; _questionAnswered = false; window._ultimaPreg = null; gameOver = false; };
window._setCurrentQuestion = (q) => { window._ultimaPreg = q; _questionAnswered = false; };
// Lets the test marathon apply panel onclicks without waiting for the frontend poll
window._applyJugadores = (idsValidos, idsFuera) => { marcarPaneles(idsValidos, idsFuera || []); };
window._ultimoEstado = null;

// ── SETUP ─────────────────────────────────────────────
function cambiarJugadores(delta) {
  numJugadores = Math.max(4, Math.min(7, numJugadores + delta));
  document.getElementById('counter-display').textContent = numJugadores;
  generarNombres();
}

function generarNombres() {
  const c = document.getElementById('nombres-container');
  c.innerHTML = '';
  for (let i = 1; i <= numJugadores; i++) {
    const row = document.createElement('div');
    row.className = 'pistolero-row';
    row.innerHTML = `<label>Pistolero ${i}</label>
      <input id="nombre-${i}" placeholder="Nombre del jugador ${i}" autocomplete="off">`;
    c.appendChild(row);
  }
}
generarNombres();

async function iniciarPartida() {
  const btn = document.getElementById('btn-iniciar');
  btn.textContent = 'CARGANDO...';
  btn.disabled = true;

  const nombres = [];
  for (let i = 1; i <= numJugadores; i++) {
    const v = document.getElementById(`nombre-${i}`)?.value.trim();
    nombres.push(v || `Pistolero ${i}`);
  }
  gameOver = false;
  await fetch('/nueva_partida', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({num_players: numJugadores, nombres})
  });
  showGameUI();
  startPolling();
}

function showGameUI() {
  document.getElementById('screen-setup').classList.remove('active');
  document.getElementById('screen-game').classList.add('active');
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('navbar').style.display = 'flex';
}

// ── NAVEGACIÓN ────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function toggleLog() {
  document.getElementById('log-drawer').classList.toggle('open');
  document.getElementById('nav-log').classList.toggle('active');
}
function toggleMenu() {
  document.getElementById('menu-modal').classList.toggle('open');
}

// ── NAIPES — símbolo y color por palo ──────────────────
function suitInfo(palo) {
  const map = {
    'Corazones': { symbol: '♥', cls: 'suit-red' },
    'Diamantes': { symbol: '♦', cls: 'suit-red' },
    'Picas':     { symbol: '♠', cls: 'suit-black' },
    'Treboles':  { symbol: '♣', cls: 'suit-black' },
  };
  return map[palo] || { symbol: '', cls: '' };
}
function paloHTML(palo, numero) {
  const s = suitInfo(palo);
  return `<span class="${s.cls}">${s.symbol} ${numero ?? ''}</span>`;
}

// ── POLLING — 200ms para respuesta rápida ─────────────
// ── SISTEMA DE ANIMACIONES DE EVENTOS ────────────────────────────────────────

const _GRUPO_COLOR = {
  ofensiva:    { bg: '#7b1a1a', icono: '💥', label: 'ATAQUE'   },
  area:        { bg: '#6b3a00', icono: '🌀', label: 'ÁREA'     },
  curacion:    { bg: '#1a5c1a', icono: '🍺', label: 'CURACIÓN' },
  equipamiento:{ bg: '#1a3a6b', icono: '🔧', label: 'EQUIPA'   },
  robo:        { bg: '#4a1a6b', icono: '🃏', label: 'ROBA'     },
  respuesta:   { bg: '#4a4a00', icono: '🛡️', label: 'RESPONDE' },
  turno:       { bg: '#2a2a2a', icono: '🤠', label: 'TURNO'    },
  descarte:    { bg: '#3a2a00', icono: '🗑️', label: 'DESCARTE' },
  otro:        { bg: '#333',    icono: '⚡', label: 'ACCIÓN'   },
};

let _eventoQueue = [];
let _eventoRunning = false;
let _overlayActual = null;

function encolarEventos(eventos) {
  _eventoQueue.push(...eventos);
  if (!_eventoRunning) _procesarSiguienteEvento();
}

// Llamar cuando llega una pregunta humana — cancela animaciones pendientes
function _limpiarAnimaciones() {
  _eventoQueue = [];
  if (_overlayActual) {
    _overlayActual.remove();
    _overlayActual = null;
  }
  _eventoRunning = false;
}

function _procesarSiguienteEvento() {
  if (!_eventoQueue.length) { _eventoRunning = false; return; }
  _eventoRunning = true;
  const ev = _eventoQueue.shift();
  _mostrarAnimacionEvento(ev, () => {
    setTimeout(_procesarSiguienteEvento, 100);
  });
}

function _mkCartaCanvas(cartaNombre, idClase) {
  // Devuelve un canvas con el arte de la carta, o null si no hay arte
  try {
    const art = getEfectoArt?.(cartaNombre?.toLowerCase?.());
    if (art?.g) {
      const cv = document.createElement('canvas');
      cv.width = 96; cv.height = 96;
      art.g(cv.getContext('2d'), 96, 96);
      cv.style.cssText = 'image-rendering:pixelated;border-radius:6px;';
      return cv;
    }
    const wart = getWeaponArt?.(cartaNombre);
    if (wart?.g) {
      const cv = drawWeaponCanvas?.(wart.g());
      if (cv) { cv.style.cssText = 'image-rendering:pixelated;border-radius:6px;max-width:96px;max-height:96px;'; return cv; }
    }
  } catch(e) {}
  return null;
}

function _mostrarAnimacionJavi(valor, preg) {
  if (!preg) return;
  const tipo = preg.tipo;
  let ev = null;

  if (tipo === 'elegir_carta' && valor !== 'FIN' && valor !== 'PODER') {
    const idx = parseInt(valor) - 1;
    const mano = preg.mano || [];
    const carta = mano[idx];
    if (carta) {
      const id_clase = carta.idClase || 0;
      const _GC = {11:'ofensiva',15:'ofensiva',17:'ofensiva',18:'ofensiva',14:'area',16:'area',13:'curacion',19:'curacion',12:'respuesta',20:'robo',21:'robo',22:'robo'};
      const grupo = _GC[id_clase] || (id_clase <= 10 ? 'equipamiento' : 'otro');
      ev = { tipo: 'carta_jugada', jugador: 'Javi', carta: carta.nombre, id_clase, grupo, objetivo: null };
    }
  } else if (tipo === 'elegir_jugador' && valor !== 'None') {
    // el objetivo se conoce al seleccionar panel — completar el ev pendiente de carta
    const estado = window._ultimoEstado;
    const j = estado?.jugadores?.find(x => x.id === parseInt(valor));
    if (j && window._javiBotPendingEv) {
      window._javiBotPendingEv.objetivo = j.nombre;
      ev = window._javiBotPendingEv;
      window._javiBotPendingEv = null;
    }
    if (!ev) return; // sin pending no hay nada que mostrar
  } else if (tipo === 'prompt') {
    ev = { tipo: 'respuesta', jugador: 'Javi', respuesta: valor, texto_prompt: preg.texto };
  }

  // Guardar pending para elegir_jugador
  if (ev?.tipo === 'carta_jugada' && ev.grupo === 'ofensiva') {
    window._javiBotPendingEv = ev;
    return; // esperar a que elija objetivo
  }
  if (!ev) return;

  // Mostrar animación sin bloquear — autocierra en la mitad del tiempo
  const onDone = () => {};
  _mostrarAnimacionEvento(ev, onDone);
}

function _mostrarAnimacionEvento(ev, onDone) {
  const grupo = ev.tipo === 'cambio_turno' ? 'turno'
              : ev.tipo === 'descarte'      ? 'descarte'
              : ev.tipo === 'respuesta'     ? 'respuesta'
              : (ev.grupo || 'otro');
  const info = _GRUPO_COLOR[grupo] || _GRUPO_COLOR.otro;

  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position:fixed;inset:0;background:rgba(0,0,0,0.78);z-index:2000;
    display:flex;align-items:center;justify-content:center;
    animation:fadeInOverlay 0.18s ease;cursor:pointer;
  `;
  _overlayActual = overlay;

  const card = document.createElement('div');
  card.style.cssText = `
    background:${info.bg};border:2px solid rgba(255,255,255,0.22);
    border-radius:18px;padding:28px 44px;min-width:300px;max-width:460px;
    text-align:center;color:#fff;font-family:monospace;
    box-shadow:0 10px 50px rgba(0,0,0,0.75);
    animation:popCard 0.24s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:10px;
  `;

  // Arte de carta (fix 5)
  const cartaCanvas = ev.carta ? _mkCartaCanvas(ev.carta, ev.id_clase) : null;
  if (cartaCanvas) {
    cartaCanvas.style.cssText += 'width:96px;height:96px;margin-bottom:4px;';
    card.appendChild(cartaCanvas);
  } else {
    const icono = document.createElement('div');
    icono.style.cssText = 'font-size:52px;';
    icono.textContent = info.icono;
    card.appendChild(icono);
  }

  const titulo = document.createElement('div');
  titulo.style.cssText = 'font-size:22px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;';

  const desc = document.createElement('div');
  desc.style.cssText = 'font-size:15px;opacity:0.92;line-height:1.6;';

  if (ev.tipo === 'cambio_turno') {
    titulo.textContent = `Turno de ${ev.jugador}`;
    desc.textContent = 'El rival está pensando…';
  } else if (ev.tipo === 'carta_jugada') {
    titulo.textContent = ev.carta || '?';
    if (ev.objetivo) {
      desc.innerHTML = `<b>${ev.jugador}</b> ataca a <b>${ev.objetivo}</b>`;
    } else if (ev.grupo === 'area') {
      desc.innerHTML = `<b>${ev.jugador}</b> ataca a <b>todos los jugadores</b>`;
    } else if (ev.grupo === 'curacion') {
      desc.innerHTML = `<b>${ev.jugador}</b> recupera vida`;
    } else if (ev.grupo === 'equipamiento') {
      desc.innerHTML = `<b>${ev.jugador}</b> equipa la carta`;
    } else if (ev.grupo === 'robo') {
      desc.innerHTML = `<b>${ev.jugador}</b> roba cartas extra`;
    } else {
      desc.innerHTML = `<b>${ev.jugador}</b> juega la carta`;
    }
  } else if (ev.tipo === 'respuesta') {
    const texto = ev.texto_prompt || '';
    const usoFallaste = /FALLASTE/i.test(texto) && ev.respuesta === 'SI';
    const usoBang     = /BANG/i.test(texto)     && ev.respuesta === 'SI';
    const recibDanio  = ev.respuesta === 'NO';
    if (usoFallaste) {
      titulo.textContent = 'Usó Fallaste';
      desc.innerHTML = `<b>${ev.jugador}</b> esquiva el disparo`;
    } else if (usoBang) {
      titulo.textContent = 'Respondió con Bang';
      desc.innerHTML = `<b>${ev.jugador}</b> devuelve el disparo`;
    } else if (recibDanio) {
      titulo.textContent = '¡Recibió daño!';
      desc.innerHTML = `<b>${ev.jugador}</b> no pudo esquivar`;
    } else {
      titulo.textContent = ev.respuesta === 'SI' ? 'Esquivado' : 'Daño recibido';
      desc.innerHTML = `<b>${ev.jugador}</b>`;
    }
  } else if (ev.tipo === 'descarte') {
    titulo.textContent = `${ev.jugador} descarta`;
    desc.innerHTML = (ev.cartas || []).join(', ');
  }

  card.appendChild(titulo);
  card.appendChild(desc);
  overlay.appendChild(card);
  document.body.appendChild(overlay);

  // Duraciones (fix 6)
  const dur = ev.tipo === 'cambio_turno' ? 1600
    : ev.tipo === 'descarte'             ? 1400
    : (grupo === 'ofensiva' || grupo === 'area') ? 2200
    : grupo === 'respuesta'              ? 1800
    : 1600;

  let closed = false;
  const cerrar = () => {
    if (closed) return;
    closed = true;
    if (_overlayActual === overlay) _overlayActual = null;
    overlay.style.animation = 'fadeOutOverlay 0.18s ease forwards';
    setTimeout(() => { overlay.remove(); onDone(); }, 180);
  };

  overlay.addEventListener('click', cerrar);
  setTimeout(cerrar, dur);
}

function startPolling() {
  if (pollInterval) clearInterval(pollInterval);
  pollInterval = setInterval(poll, 200);
}

function preguntaKey(preg) {
  if (!preg) return null;
  // Incluye todos los campos que pueden cambiar entre preguntas del mismo tipo
  // (ej: Almacén — mismo tipo, pero lista de cartas se reduce por turno)
  return JSON.stringify({
    tipo:       preg.tipo,
    texto:      preg.texto || '',
    opciones:   preg.opciones || [],
    jugador_id: preg.jugador_id ?? null,
    cartas:     (preg.cartas || []).map(c => c.nombre),
    mano:       (preg.mano   || []).map(c => c.nombre + c.indice),
    mano_size:  preg.mano_size ?? null,
  });
}

async function poll() {
  if (gameOver) return;
  try {
    const res = await fetch('/estado');
    const data = await res.json();

    if (data.error) {
      setPromptText('💥 ' + data.error, true);
      clearInterval(pollInterval);
      return;
    }
    if (data.estado?.jugadores) {
      window._ultimoEstado = data.estado;
      window._descarteRecientes = data.estado.descarte_recientes || [];
      renderEstado(data.estado);
      renderDescarte(data.estado.descarte_top);
    }
    if (data.log) renderLog(data.log);

    // Solo re-renderizar la pregunta si realmente cambió
    const key = preguntaKey(data.pregunta);
    if (key !== lastPreguntaKey) {
      lastPreguntaKey = key;
      if (data.pregunta) {
        // Llegó pregunta para el humano — cancelar cualquier animación antes de renderizar
        _limpiarAnimaciones();
        renderPregunta(data.pregunta);
      } else clearPrompt();
    }

    // Si hay pregunta humana activa, garantizar que no haya overlay bloqueando
    if (data.pregunta) {
      _limpiarAnimaciones();
    }

    // Encolar eventos solo si NO hay pregunta activa para el humano
    if (data.eventos?.length && !data.pregunta) {
      encolarEventos(data.eventos);
    }
  } catch(e) { /* ignora errores de red transitorios */ }
}

// ── ACCIÓN — debounce + re-poll inmediato ─────────────
async function enviarAccion(valor) {
  if (isSending) return;
  // Bloquear si no hay pregunta activa o ya fue respondida (evita doble envío)
  if ((!window._ultimaPreg || _questionAnswered) && valor !== 'ok') return;
  _questionAnswered = true;
  isSending = true;

  // Animación de Javi (fix 4): mostrar qué hizo el humano antes de limpiar UI
  _mostrarAnimacionJavi(valor, window._ultimaPreg);

  // Limpiar UI inmediatamente — eliminar botones y paneles antes de esperar respuesta
  clearBotones();
  limpiarPaneles();
  document.getElementById('mesa-cards').innerHTML = '';
  setSendingState(true);

  try {
    await fetch('/accion', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({valor})
    });
    // Forzar re-render en el próximo poll aunque la pregunta parezca igual
    lastPreguntaKey = null;
    await poll();
  } finally {
    isSending = false;
    setSendingState(false);
  }
}

function setSendingState(on) {
  const bar = document.getElementById('prompt-bar');
  bar.classList.toggle('sending', on);
  bar.querySelectorAll('.prompt-btn').forEach(b => b.disabled = on);
  // Deshabilita también wrappers de mano
  document.querySelectorAll('.hc-wrap').forEach(w => {
    w.style.pointerEvents = on ? 'none' : '';
  });
  // Deshabilita cartas de mesa
  document.querySelectorAll('.mesa-card, .rival-card-hidden, .rival-card-equip').forEach(c => {
    c.style.pointerEvents = on ? 'none' : '';
  });
}

// ── ESTADO GLOBAL ────────────────────────────────────
let _idsSeleccionables = [];
let _idsFuera = [];
let _handLocked = false; // deprecated — mantenido por compatibilidad
let _ultimoHumanMano = [];

function _aplicarSeleccionables() {
  document.querySelectorAll('.rival-panel').forEach(panel => {
    const id = parseInt(panel.dataset.id);
    panel.classList.remove('seleccionable', 'fuera-alcance');
    panel.onclick = null;
    if (_idsSeleccionables.includes(id)) {
      panel.classList.add('seleccionable');
      panel.onclick = () => enviarAccion(String(id));
    } else if (_idsFuera.includes(id)) {
      panel.classList.add('fuera-alcance');
    }
  });
}

function clearPrompt() {
  // No borramos _ultimaPreg aquí: solo enviarAccion lo borra cuando el usuario responde.
  // Borrarlo aquí causa un race condition entre preguntas (brief null del servidor).
  setPromptText('');
  clearBotones();
  limpiarPaneles();
  document.getElementById('mesa-cards').innerHTML = '';
  if (_ultimoHumanMano.length > 0) {
    renderMano(_ultimoHumanMano, [], false);
  }
}

// ── RENDER TABLERO ────────────────────────────────────
const _prevVidas = {};
function renderEstado(estado) {
  const n = estado.jugadores.length;
  const turnoActual = ((estado.turno_actual % n) + n) % n;

  const jugTurno = estado.jugadores[turnoActual];
  if (jugTurno) document.getElementById('phase-badge').textContent = jugTurno.nombre.toUpperCase();

  const zone = document.getElementById('rivals-zone');
  // Rebuild only when player count changes
  if (zone.children.length !== n) zone.innerHTML = '';

  estado.jugadores.forEach(j => {
    let panel = zone.querySelector(`[data-id="${j.id}"]`);
    if (!panel) {
      panel = document.createElement('div');
      panel.className = 'rival-panel';
      panel.dataset.id = j.id;
      zone.appendChild(panel);
    }

    const isTurno = j.id === turnoActual;
    panel.className = 'rival-panel'
      + (j.muerto ? ' muerto' : '')
      + (isTurno  ? ' turno'  : '');

    const initials = j.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    const sheriffBadge = j.rol === 'Sheriff' ? '<div class="rp-sheriff-badge">⭐</div>' : '';
    const rolShow = j.muerto && j.rol !== '?'
      ? `<div style="font-family:var(--font-mono);font-size:8px;font-weight:700;color:var(--red);margin-top:2px;">${j.rol.toUpperCase()}</div>` : '';

    let hearts = '<div class="hearts">';
    for (let i = 0; i < j.vidasMax; i++)
      hearts += `<span class="heart ${i < j.vidas ? 'full' : 'empty'}">♥</span>`;
    hearts += '</div>';

    const armaNames = {0:'COLT',1:'VOLC',2:'SCHO',3:'REMI',4:'CARA',5:'WINC'};
    const arma = armaNames[j.arma] ?? j.arma;

    const badgeMap = {carcel:'⛓️',mustang:'🐎',barril:'🛢️',dinamita:'💣',miraTelescopica:'🔭',volcanic:'🔥'};
    let badges = '<div class="rp-badges">';
    const estados = j.estados || {};
    for (const [k, lbl] of Object.entries(badgeMap))
      if (estados[k]) badges += `<span class="rp-badge rp-badge-${k}">${lbl}</span>`;
    badges += '</div>';

    const prevV = _prevVidas[j.id];
    const tookDamage = prevV !== undefined && j.vidas < prevV;
    _prevVidas[j.id] = j.vidas;

    panel.innerHTML = `
      <div class="rp-portrait">${sheriffBadge}${initials}</div>
      <div class="rp-body">
        <div class="rp-name">${j.nombre}</div>
        <div class="rp-personaje">${j.personaje}</div>
        ${rolShow}
        ${hearts}
        <div class="rp-stats">${arma} · Rng ${j.distancia} · ${j.numCartas}🂠</div>
        ${badges}
      </div>`;

    if (tookDamage) {
      panel.classList.add('damaged');
      panel.addEventListener('animationend', () => panel.classList.remove('damaged'), {once:true});
    }
  });

  // Re-aplicar seleccionables tras reconstruir paneles
  _aplicarSeleccionables();

  // Mano humana siempre visible (no interactiva si no es su turno)
  if (estado.human_mano) {
    _ultimoHumanMano = estado.human_mano;
    const pregActiva = document.getElementById('prompt-texto').textContent.trim();
    // Solo mostrar si no hay una pregunta activa que ya gestiona la mano
    const pregunta = window._ultimaPreg;
    const tienePromptMano = pregunta && (pregunta.tipo === 'elegir_carta' || pregunta.tipo === 'prompt');
    if (!tienePromptMano) {
      renderMano(estado.human_mano, [], false);
    }
  }

  // Rol del jugador humano
  const humanJ = estado.jugadores.find(j => j.id === 0);
  if (humanJ) {
    let rolEl = document.getElementById('my-rol-badge');
    if (!rolEl) {
      rolEl = document.createElement('span');
      rolEl.id = 'my-rol-badge';
      rolEl.style.cssText = 'font-family:var(--font-mono);font-size:10px;font-weight:700;color:var(--accent);letter-spacing:1px;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;';
      document.getElementById('phase-badge').insertAdjacentElement('afterend', rolEl);
    }
    rolEl.textContent = humanJ.rol !== '?' ? humanJ.rol.toUpperCase() : '';
  }
}

// ── RENDER MANO — wrapper pattern sin jitter ──────────
function renderMano(mano, opciones, jugable) {
  const c = document.getElementById('hand-cards');
  c.innerHTML = '';
  if (!mano || mano.length === 0) return;

  const total = mano.length;
  const spread = Math.min(total * 30, 340);
  const step = total > 1 ? spread / (total - 1) : 0;
  const startX = -spread / 2;
  const maxAngle = Math.min(total * 3.5, 22);

  mano.forEach((carta, i) => {
    const esJugable = jugable && opciones.includes(String(carta.indice + 1));
    const tipoCls = carta.tipo === 'Arma' ? ' tipo-arma' : carta.tipo === 'Objeto' ? ' tipo-objeto' : '';
    const angle = total > 1 ? (i / (total - 1) - 0.5) * maxAngle * 2 : 0;
    const x = startX + i * step;

    // Wrapper: holds rotation (stays fixed on hover)
    // z-index NO se pone inline — lo gestiona CSS :hover para evitar conflictos
    const wrap = document.createElement('div');
    wrap.className = 'hc-wrap';
    wrap.style.left = `calc(50% + ${x}px - 37px)`;
    wrap.style.transform = `rotate(${angle}deg)`;

    // Inner card: only does translateY on hover
    const div = document.createElement('div');
    div.className = 'hand-card' + tipoCls + (esJugable ? ' jugable' : '');

    const weaponInfo = carta.tipo === 'Arma' ? getWeaponArt(carta.nombre) : null;
    const efectoInfo = !weaponInfo ? getEfectoArt(carta.nombre) : null;
    if (weaponInfo) {
      const nombre = document.createElement('div'); nombre.className = 'hc-nombre'; nombre.textContent = carta.nombre;
      const artWrap = document.createElement('div'); artWrap.className = 'hc-art';
      artWrap.appendChild(drawWeaponCanvas(weaponInfo.g()));
      const bottom = document.createElement('div'); bottom.className = 'hc-bottom';
      if (weaponInfo.skull) {
        const sk = document.createElement('div'); sk.className = 'hc-skull';
        sk.appendChild(drawSkullCanvas()); bottom.appendChild(sk);
      }
      const rng = document.createElement('div'); rng.className = 'hc-range'; rng.textContent = weaponInfo.range;
      bottom.appendChild(rng);
      div.append(nombre, artWrap, bottom);
    } else if (efectoInfo) {
      const nombre = document.createElement('div'); nombre.className = 'hc-nombre'; nombre.textContent = carta.nombre;
      const artWrap = document.createElement('div'); artWrap.className = 'hc-art';
      artWrap.appendChild(renderEfectoCanvas(efectoInfo.g()));
      const tipo = document.createElement('div'); tipo.className = 'hc-tipo'; tipo.textContent = carta.tipo;
      div.append(nombre, artWrap, tipo);
    } else {
      div.innerHTML = `<div class="hc-nombre">${carta.nombre}</div><div class="hc-tipo">${carta.tipo}</div>`;
    }

    if (esJugable) {
      wrap.onclick = () => {
        if (isSending) return;
        div.classList.add('clicked');
        enviarAccion(String(carta.indice + 1));
      };
    }

    wrap.appendChild(div);
    c.appendChild(wrap);
  });
}

// ── RENDER PREGUNTA ───────────────────────────────────
function mkMesaCardConArte(c) {
  const d = document.createElement('div');
  d.className = 'mesa-card';
  const nombre = document.createElement('div'); nombre.className = 'mc-nombre'; nombre.textContent = c.nombre;
  const palo = document.createElement('div'); palo.className = 'mc-palo'; palo.innerHTML = paloHTML(c.palo, c.numero);
  const weaponInfo = getWeaponArt(c.nombre);
  const efectoInfo = !weaponInfo ? getEfectoArt(c.nombre) : null;
  d.appendChild(nombre);
  if (weaponInfo) {
    const artWrap = document.createElement('div'); artWrap.className = 'mc-art';
    artWrap.appendChild(drawWeaponCanvas(weaponInfo.g()));
    d.appendChild(artWrap);
  } else if (efectoInfo) {
    const artWrap = document.createElement('div'); artWrap.className = 'mc-art';
    artWrap.appendChild(renderEfectoCanvas(efectoInfo.g()));
    d.appendChild(artWrap);
  }
  d.appendChild(palo);
  return d;
}

function renderPregunta(preg) {
  if (!preg) return;
  _questionAnswered = false;
  window._ultimaPreg = preg;
  const tipo = preg.tipo;

  if (tipo === 'elegir_personaje') { renderElegirPersonaje(preg); return; }
  if (tipo === 'game_over')        { renderGameOver(preg); return; }

  showScreen('screen-game');
  limpiarPaneles();
  document.getElementById('mesa-cards').innerHTML = '';

  if (tipo === 'elegir_carta') {
    setPromptText(preg.texto);
    renderMano(preg.mano || [], preg.opciones, true);
    const bots = document.getElementById('prompt-botones');
    bots.innerHTML = '';
    if (preg.permitir_poder)
      bots.appendChild(mkPromptBtn('⚡ PODER', 'poder', () => enviarAccion('PODER')));
    if (preg.permitir_fin)
      bots.appendChild(mkPromptBtn('✓ FIN DE TURNO', 'fin', () => enviarAccion('FIN')));
    return;
  }

  if (tipo === 'elegir_jugador') {
    setPromptText(preg.texto);
    clearBotones();
    marcarPaneles(preg.jugadores_validos, preg.jugadores_fuera_alcance || []);
    document.getElementById('prompt-botones').appendChild(
      mkPromptBtn('✕ CANCELAR', 'cancel', () => enviarAccion('None'))
    );
    return;
  }

  if (tipo === 'elegir_carta_rival') {
    setPromptText(preg.texto);
    clearBotones();
    const mesa = document.getElementById('mesa-cards');
    for (let i = 0; i < preg.mano_size; i++) {
      const d = document.createElement('div');
      d.className = 'rival-card-hidden';
      d.textContent = '🂠';
      d.onclick = () => enviarAccion(`mano:${i}`);
      mesa.appendChild(d);
    }
    (preg.equipadas || []).forEach(c => {
      const d = document.createElement('div');
      d.className = 'rival-card-equip';
      d.innerHTML = `<div class="rce-nombre">${c.nombre}</div><div class="rce-badge">EQUIPADA</div>`;
      d.onclick = () => enviarAccion(`equipo:${c.indice}`);
      mesa.appendChild(d);
    });
    return;
  }

  if (tipo === 'elegir_lucky_duke') {
    setPromptText('Lucky Duke: elige el resultado del desenfunde');
    clearBotones();
    const mesa = document.getElementById('mesa-cards');
    [preg.carta1, preg.carta2].forEach((c, i) => {
      const d = document.createElement('div');
      d.className = 'mesa-card';
      d.innerHTML = `<div class="mc-nombre">${c.nombre}</div><div class="mc-palo">${paloHTML(c.palo, c.numero)}</div>`;
      d.onclick = () => enviarAccion(String(i));
      mesa.appendChild(d);
    });
    return;
  }

  if (tipo === 'elegir_almacen_carta' || tipo === 'elegir_kit_carlson') {
    setPromptText(tipo === 'elegir_kit_carlson'
      ? 'Kit Carlson: elige la carta a devolver al mazo'
      : 'Almacén: elige una carta');
    clearBotones();
    const mesa = document.getElementById('mesa-cards');
    (preg.cartas || []).forEach((c, i) => {
      const d = mkMesaCardConArte(c);
      d.onclick = () => enviarAccion(String(i));
      mesa.appendChild(d);
    });
    return;
  }

  if (tipo === 'elegir_robo_pedro') {
    setPromptText('Pedro Ramírez: ¿coges la carta del descarte?');
    const mesa = document.getElementById('mesa-cards');
    const c = preg.carta_top;
    const d = document.createElement('div');
    d.className = 'mesa-card';
    d.innerHTML = `<div class="mc-nombre">${c.nombre}</div><div class="mc-palo">${paloHTML(c.palo, c.numero)}</div>`;
    mesa.appendChild(d);
    const bots = document.getElementById('prompt-botones');
    bots.innerHTML = '';
    bots.appendChild(mkPromptBtn('COGER DESCARTE', 'fin',  () => enviarAccion('SI')));
    bots.appendChild(mkPromptBtn('DEL MAZO',       '',    () => enviarAccion('NO')));
    return;
  }

  if (tipo === 'elegir_robo_jesse') {
    setPromptText('Jesse Jones: ¿robas de un rival o del mazo?');
    clearBotones();
    marcarPaneles(preg.rivales, []);
    document.getElementById('prompt-botones').appendChild(
      mkPromptBtn('DEL MAZO', '', () => enviarAccion('None'))
    );
    return;
  }

  // Prompt genérico
  setPromptText(preg.texto);
  const bots = document.getElementById('prompt-botones');
  bots.innerHTML = '';

  // Punto 5: detectar si el texto pide usar BANG o FALLASTE y el jugador no tiene la carta
  const texto = preg.texto || '';
  const pideBANG     = /usar un BANG/i.test(texto);
  const pideFALLASTE = /usar un FALLASTE/i.test(texto);
  const manoHumana   = (window._ultimoEstado?.human_mano || []);
  const tieneBANG     = manoHumana.some(c => c.idClase === 11);
  const tieneFALLASTE = manoHumana.some(c => c.idClase === 12);
  const sinCarta = (pideBANG && !tieneBANG) || (pideFALLASTE && !tieneFALLASTE);

  if (sinCarta) {
    const nombreCarta = pideBANG ? 'BANG' : 'FALLASTE';
    setPromptText(`${texto}\n⚠️ No tienes ${nombreCarta} en la mano — recibirás daño.`);
  }

  (preg.opciones || []).forEach(opt => {
    if (sinCarta && opt === 'SI') {
      // No mostrar el botón SI si no tiene la carta
      return;
    }
    const label = sinCarta && opt === 'NO' ? '💔 Aceptar daño' : opt;
    bots.appendChild(mkPromptBtn(label, opt === 'NO' ? '' : '', () => enviarAccion(opt)));
  });
}

// ── CHARACTER SELECTION — click en carta = confirmar ──
function renderElegirPersonaje(preg) {
  showScreen('screen-personaje');
  document.getElementById('personaje-quien').textContent =
    `${preg.nombre_jugador} · ${preg.rol}`;

  const c = document.getElementById('personaje-cards-container');
  c.innerHTML = '';

  [preg.personaje_a, preg.personaje_b].forEach((p, i) => {
    const val = i === 0 ? 'A' : 'B';
    const div = document.createElement('div');
    div.className = 'personaje-card-new';

    let heartsHTML = '<div class="hearts">';
    for (let v = 0; v < p.vidas; v++) heartsHTML += '<span class="heart full">♥</span>';
    heartsHTML += '</div>';

    const initials = p.nombre.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    div.innerHTML = `
      <div class="personaje-portrait">${initials}</div>
      <div class="personaje-info">
        <div class="p-name">${p.nombre}</div>
        <div class="p-vidas">${heartsHTML}</div>
        <div class="p-desc">${p.desc}</div>
      </div>`;

    // Click en la carta = elegir directamente, sin botón extra
    div.onclick = () => {
      if (isSending) return;
      div.classList.add('selected');
      // Delay visual breve para que se vea la selección antes de cambiar pantalla
      setTimeout(() => {
        showScreen('screen-game');
        enviarAccion(val);
      }, 160);
    };

    c.appendChild(div);
  });
}

// ── GAME OVER ─────────────────────────────────────────
function renderGameOver(preg) {
  gameOver = true;
  clearInterval(pollInterval);
  showScreen('screen-gameover');
  document.getElementById('go-ganador').textContent =
    `¡${preg.ganador.toUpperCase()} HAN GANADO!`;

  const estado = window._ultimoEstado;
  if (estado) {
    const tbody = document.getElementById('go-tabla');
    tbody.innerHTML = '<tr><th>Pistolero</th><th>Personaje</th><th>Rol</th><th>Estado</th></tr>';
    estado.jugadores.forEach(j => {
      const tr = document.createElement('tr');
      tr.className = j.muerto ? 'muerto' : 'vivo';
      tr.innerHTML = `<td>${j.nombre}</td><td>${j.personaje}</td><td>${j.rol}</td><td>${j.muerto ? '💀 Caído' : '✅ Vivo'}</td>`;
      tbody.appendChild(tr);
    });
  }
  enviarAccion('ok');
}

// ── LOG ───────────────────────────────────────────────
let _lastLogMsg = '';
function renderLog(msgs) {
  const lastMsg = msgs[msgs.length - 1] || '';
  if (msgs.length === logCount && lastMsg === _lastLogMsg) return;
  logCount = msgs.length;
  _lastLogMsg = lastMsg;
  const c = document.getElementById('log-msgs');
  c.innerHTML = '';
  msgs.forEach(m => {
    const d = document.createElement('div');
    const important = m.includes('RONDA') || m.includes('---') || m.includes('💀') || m.includes('🏆');
    d.className = 'log-msg' + (important ? ' important' : '');
    d.textContent = m;
    c.appendChild(d);
  });
  c.scrollTop = c.scrollHeight;
}

  _idsSeleccionables = [];

  document.querySelectorAll('.rival-panel').forEach(p => {

})();

let _lastDescarte = null;
function renderDescarte(carta) {
  const face = document.getElementById('discard-pile');
  const back = document.getElementById('discard-empty');
  if (carta) {
    const isNew = !_lastDescarte || _lastDescarte.idObjeto !== carta.idObjeto;
    _lastDescarte = carta;
    face.style.display = '';
    back.style.display = 'none';
    face.innerHTML = '';

    const nm = document.createElement('div');
    nm.className = 'pc-nombre';
    nm.textContent = carta.nombre;
    face.appendChild(nm);

    const artDiv = document.createElement('div');
    artDiv.className = 'pc-art';
    try {
      const ei = getEfectoArt(carta.nombre);
      const wi = getWeaponArt?.(carta.nombre);
      if (ei) { artDiv.appendChild(renderEfectoCanvas(ei.g())); }
      else if (wi) { const cv = drawWeaponCanvas(wi.g()); cv.style.cssText='max-width:56px;max-height:56px;image-rendering:pixelated;'; artDiv.appendChild(cv); }
    } catch(e) {}
    face.appendChild(artDiv);

    const pl = document.createElement('div');
    pl.className = 'pc-palo';
    pl.innerHTML = paloHTML(carta.palo, carta.numero);
    face.appendChild(pl);

    if (isNew) { face.classList.remove('card-in'); void face.offsetWidth; face.classList.add('card-in'); }
    face.style.cursor = 'pointer';
    face.onclick = () => mostrarDescartes();
  } else {
    _lastDescarte = null;
    face.style.display = 'none';
    back.style.display = '';
  }
}

function mostrarDescartes() {
  const recientes = window._descarteRecientes || [];
  let overlay = document.getElementById('descarte-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'descarte-overlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;';
    overlay.onclick = () => overlay.remove();
    document.body.appendChild(overlay);
  } else {
    overlay.innerHTML = '';
  }
  const title = document.createElement('div');
  title.style.cssText = 'font-family:var(--font-head);font-size:14px;color:#fff;letter-spacing:2px;margin-bottom:8px;';
  title.textContent = 'ÚLTIMAS CARTAS DESCARTADAS';
  overlay.appendChild(title);
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:400px;';
  recientes.forEach(c => {
    const d = mkMesaCardConArte(c);
    d.style.cursor = 'default';
    d.onclick = e => e.stopPropagation();
    row.appendChild(d);
  });
  overlay.appendChild(row);
  const hint = document.createElement('div');
  hint.style.cssText = 'font-family:var(--font-mono);font-size:10px;color:#aaa;margin-top:8px;';
  hint.textContent = 'Pulsa para cerrar';
  overlay.appendChild(hint);
}
</script>
</body>
</html>
